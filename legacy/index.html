<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samaqu Customer Service Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&amp;display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root{
 --bg:#F5F3EE;--w:#FFFFFF;--b:#E6E3DB;--b2:#D9D5CB;
 --t:#1E201F;--t2:#5C605C;--t3:#8F928D;
 --g:#1E201F;--g2:#33363A;
 --acc:#3E6A54;--accl:#E7EEE9;--acc2:#F1F5F2;
 --gl:#EFEDE7;--gl2:#F8F7F3;
 --warn:#9A6A12;--warnl:#FBF3E2;--red:#B42318;--redl:#FDEEEC;
 --r:14px;--sh:0 1px 2px rgba(30,32,31,.04),0 4px 14px rgba(30,32,31,.05)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--t);font-size:14.5px;line-height:1.6;overflow-x:hidden}
a{color:var(--acc)}
button{font-family:inherit;cursor:pointer}input,textarea,select{font-family:inherit;font-size:14px;color:var(--t)}
.app{display:flex;min-height:100vh}
/* Sidebar */
.sb{width:264px;background:var(--w);border-right:1px solid var(--b);position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:40;transition:transform .25s}
.brand{display:flex;gap:11px;align-items:center;padding:18px 20px 12px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.brand b{display:block;font-size:14px;letter-spacing:-.01em}.brand small{color:var(--t3);font-size:11.5px}
.nav{flex:1;overflow-y:auto;padding:2px 12px 8px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
.ng{font-size:10.5px;font-weight:600;letter-spacing:.08em;color:var(--t3);padding:12px 10px 4px;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;background:none;border-radius:9px;color:var(--t2);font-size:13.5px;font-weight:500;text-align:left;transition:background .12s,color .12s}
.ni:hover{background:var(--gl);color:var(--t)}.ni.on{background:var(--g);color:#fff;font-weight:600}.ni.on:hover{background:var(--g)}
.ni svg{width:17px;height:17px;flex-shrink:0}
.prof{border-top:1px solid var(--b);padding:12px 14px;display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--accl);color:var(--acc);display:grid;place-items:center;font-weight:600;font-size:13px;flex-shrink:0}
.prof .in{flex:1;min-width:0}.prof b{font-size:13px;display:block}
.prof select{border:0;background:none;color:var(--t3);font-size:11.5px;padding:0;margin-left:-2px;max-width:100%;cursor:pointer}
.icb{border:1px solid var(--b);background:var(--w);border-radius:9px;width:32px;height:32px;display:grid;place-items:center;color:var(--t2);flex-shrink:0}
.icb:hover{background:var(--gl)}.icb svg{width:16px;height:16px}
/* Main */
.main{margin-left:264px;flex:1;min-width:0}
.top{height:60px;border-bottom:1px solid var(--b);background:rgba(245,243,238,.88);backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:0 32px;position:sticky;top:0;z-index:30}
.top .crumb{color:var(--t3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .crumb b{color:var(--t);font-weight:600}
.menu{display:none}
.gs{margin-left:auto;position:relative}.gs input{width:300px;padding:8px 12px 8px 34px;border:1px solid var(--b);border-radius:9px;background:var(--w)}
.gs svg{position:absolute;left:11px;top:9px;width:16px;height:16px;color:var(--t3)}
.page{padding:32px;max-width:1280px;margin:0 auto}
/* Type */
h1{font-size:27px;font-weight:650;letter-spacing:-.025em;line-height:1.25}h2{font-size:17px;font-weight:600;letter-spacing:-.01em}h3{font-size:15px;font-weight:600}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.sub{color:var(--t2);margin-top:6px;max-width:720px}
.lead{font-size:16px;color:var(--t2);line-height:1.65}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
/* Surfaces */
.card{background:var(--w);border:1px solid var(--b);border-radius:var(--r);padding:22px;box-shadow:var(--sh);min-width:0}
.card.flat{box-shadow:none}.card.soft{background:var(--gl2);box-shadow:none}
.ck{cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}.ck:hover{border-color:var(--b2);box-shadow:0 6px 22px rgba(30,32,31,.08);transform:translateY(-1px)}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.stat .l{color:var(--t2);font-size:13px;display:flex;justify-content:space-between;align-items:center}
.stat .v{font-size:30px;font-weight:650;margin-top:8px;letter-spacing:-.03em}.stat .h{color:var(--t3);font-size:12.5px}
.sic{width:34px;height:34px;border-radius:10px;background:var(--gl);color:var(--t);display:grid;place-items:center;flex-shrink:0}.sic svg{width:16px;height:16px}
.sic.acc{background:var(--accl);color:var(--acc)}
.bar{height:6px;background:var(--gl);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .5s}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:500;background:var(--gl);color:var(--t2);white-space:nowrap;text-decoration:none}
.tag.gr{background:var(--accl);color:var(--acc)}.tag.yl{background:var(--warnl);color:var(--warn)}.tag.rd{background:var(--redl);color:var(--red)}
.chips .tag{white-space:normal}.tag.demo{background:var(--warnl);color:var(--warn);border:1px dashed #E5C98F}
.tag svg{width:12px;height:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--b);background:var(--w);color:var(--t);font-weight:500;font-size:13.5px;white-space:nowrap;transition:background .12s}
.btn:hover{background:var(--gl)}.btn svg{width:15px;height:15px}
.btn.p{background:var(--g);border-color:var(--g);color:#fff}.btn.p:hover{background:var(--g2)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--gl)}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.mt{margin-top:16px}.mt2{margin-top:28px}.mt1{margin-top:8px}.muted{color:var(--t2)}.sm{font-size:13px}.xs{font-size:12px}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--b)}.li:first-child{border-top:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--b);background:var(--w);font-size:12.5px;color:var(--t2);font-weight:500}
.chip:hover{border-color:var(--b2)}.chip.on{background:var(--g);border-color:var(--g);color:#fff}
/* Segmented */
.seg{display:inline-flex;background:var(--gl);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:6px 13px;border-radius:8px;font-size:13px;font-weight:500;color:var(--t2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--w);color:var(--t);box-shadow:0 1px 3px rgba(0,0,0,.08)}.seg button svg{width:14px;height:14px}
.seg .n{font-size:11px;color:var(--t3)}
/* Toolbar */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.search{position:relative;flex:1;min-width:200px;max-width:380px}.search svg{position:absolute;left:11px;top:10px;width:16px;height:16px;color:var(--t3)}
.search input{padding-left:34px}
.inp{width:100%;padding:9px 12px;border:1px solid var(--b);border-radius:9px;background:var(--w);outline:none;transition:border-color .12s,box-shadow .12s}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accl)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8F928D 50%),linear-gradient(135deg,#8F928D 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.inp.auto{width:auto}
textarea.inp{resize:vertical;min-height:70px;line-height:1.55}
/* Notes */
.note{display:flex;gap:10px;padding:12px 14px;border-radius:11px;background:var(--warnl);color:#6E4C0E;font-size:13.5px}.note svg{width:17px;height:17px;flex-shrink:0;margin-top:2px}
.note.gn{background:var(--acc2);color:#2F5442}.note.nt{background:var(--gl2);color:var(--t2);border:1px solid var(--b)}.note.rd{background:var(--redl);color:#8A1C12}
/* Rail layout */
.lib{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;align-items:start}
.rail{position:sticky;top:84px;display:flex;flex-direction:column;gap:2px}
.rail .rt{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);padding:4px 10px 6px}
.rail button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--t2);font-weight:500}
.rail button:hover{background:var(--gl);color:var(--t)}.rail button.on{background:var(--w);color:var(--t);box-shadow:var(--sh);font-weight:600}
.rail button .n{font-size:11.5px;color:var(--t3);font-weight:500}
.rail-sel{display:none}
/* Chat */
.bubble{max-width:80%;padding:10px 14px;border-radius:14px;font-size:13.5px;white-space:pre-wrap;line-height:1.5;word-wrap:break-word}
.bc{background:var(--w);border:1px solid var(--b);align-self:flex-start;border-bottom-left-radius:4px}
.ba{background:var(--g);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.bai{background:var(--w);border:1px solid var(--b);align-self:flex-start;border-bottom-left-radius:4px}
.who{font-size:11px;color:var(--t3);margin-bottom:3px}
.chat{display:flex;flex-direction:column;gap:10px;padding:18px;overflow:auto;height:460px;background:var(--gl2);border:1px solid var(--b);border-radius:12px}
.convo{display:flex;flex-direction:column;gap:8px;background:var(--gl2);border:1px solid var(--b);border-radius:12px;padding:14px}
.convo .bc{background:var(--w)}
.cin{display:flex;gap:8px;margin-top:10px}
.score{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.score div{width:90px;height:90px;border-radius:50%;background:var(--w);display:grid;place-items:center;text-align:center}
.score b{font-size:28px;line-height:1;letter-spacing:-.02em}.score small{font-size:11px;color:var(--t3);display:block;margin-top:2px}
.score.sm2{width:76px;height:76px}.score.sm2 div{width:60px;height:60px}.score.sm2 b{font-size:19px}
.before{background:var(--redl);border-radius:11px;padding:14px 16px;color:#5B1A12}.after{background:var(--acc2);border-radius:11px;padding:14px 16px;color:#22392E}
.lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.content h3{margin:22px 0 6px;font-size:16px}.content p{color:#363A37;margin:6px 0}.content ul{padding-left:20px}.content li{margin:5px 0;color:#363A37}
.opt{display:block;width:100%;text-align:left;padding:13px 15px;border:1px solid var(--b);border-radius:11px;background:var(--w);margin-top:8px;font-size:14px;line-height:1.5}
.opt:hover{border-color:var(--b2)}.opt.sel{border-color:var(--g);background:var(--gl2);box-shadow:inset 0 0 0 1px var(--g)}.opt.ok{border-color:var(--acc);background:var(--accl)}.opt.no{border-color:var(--red);background:var(--redl)}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(24,26,25,.42);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal.on{display:flex}.mbox{background:var(--w);border-radius:16px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.mbox.lg{max-width:900px}
.fsec{margin-top:24px;padding-bottom:8px;border-bottom:1px solid var(--b);font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--t2)}
.fgrid{gap:14px;margin-top:14px}
.flab{display:block;font-weight:500;margin-bottom:5px;font-size:13px}
.ferr{color:var(--red);display:none;margin-top:4px;font-size:12.5px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--b);padding-top:16px;margin-top:24px;position:sticky;bottom:-26px;background:var(--w);padding-bottom:4px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--t);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90vw;display:flex;gap:8px;align-items:center}
.toast.on{opacity:1;transform:translateX(-50%)}.toast.err{background:var(--red)}
.empty{text-align:center;color:var(--t3);padding:44px 12px}.empty svg{color:var(--t3)}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--t3);margin:0 2px;animation:b 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.3}50%{opacity:1}}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--b);vertical-align:top}th{color:var(--t3);font-weight:500;font-size:12.5px}
.tw{overflow-x:auto}
/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding:28px}
.hero h1{font-size:28px}
/* Journey */
.journey{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;position:relative}
.journey:before{content:"";position:absolute;left:7%;right:7%;top:27px;height:2px;background:var(--b)}
.jstep{position:relative;border:0;background:none;text-align:center;padding:4px 4px 10px;border-radius:12px;color:var(--t2)}
.jstep .jn{width:40px;height:40px;border-radius:50%;margin:7px auto 10px;display:grid;place-items:center;background:var(--w);border:2px solid var(--b2);font-weight:650;font-size:13px;color:var(--t2);position:relative;transition:.15s}
.jstep b{display:block;font-size:12.5px;line-height:1.35;color:var(--t);font-weight:600}
.jstep small{display:block;font-size:11px;color:var(--t3);margin-top:3px}
.jstep:hover .jn{border-color:var(--t)}
.jstep.on .jn{background:var(--g);border-color:var(--g);color:#fff;box-shadow:0 0 0 5px var(--gl)}
.jstep.seen .jn{border-color:var(--acc);color:var(--acc)}
.jstep.on.seen .jn{color:#fff}
.branch{margin-top:18px;border:1.5px dashed #E2B1A9;background:#FFF9F7;border-radius:14px;padding:14px 18px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:.15s;width:100%;text-align:left;font-size:inherit;color:inherit}
.branch:hover{border-color:var(--red)}.branch.on{background:var(--redl);border-style:solid;border-color:var(--red)}
.steps{counter-reset:s;list-style:none;padding:0}.steps li{counter-increment:s;display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--b);font-size:14px}.steps li:first-child{border-top:0}
.steps li:before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--gl);color:var(--t);font-size:12px;font-weight:600;display:grid;place-items:center;flex-shrink:0;margin-top:1px}
.dots{list-style:none;padding:0}.dots li{display:flex;gap:10px;padding:5px 0;font-size:14px}.dots li svg{width:16px;height:16px;flex-shrink:0;margin-top:3px}
.kh{display:flex;gap:8px;align-items:center;margin-bottom:8px}.kh svg{width:16px;height:16px;color:var(--t2)}.kh h3{font-size:14px}
.ref{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--b);border-radius:10px;margin-top:8px;background:var(--w);cursor:pointer;text-align:left;width:100%;font-size:13px;color:var(--t)}
.ref:hover{border-color:var(--b2);background:var(--gl2)}.ref svg{width:15px;height:15px;color:var(--t3);flex-shrink:0}
/* Guidelines */
.gnum{font-size:12px;font-weight:600;color:var(--t3);width:24px;flex-shrink:0}
.point{display:flex;gap:14px;padding:13px 0;border-top:1px solid var(--b)}.point:first-child{border-top:0}
.point .pn{width:28px;height:28px;border-radius:8px;background:var(--gl);display:grid;place-items:center;font-size:12px;font-weight:600;flex-shrink:0}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.do,.dont{border-radius:12px;padding:14px 16px;font-size:13.5px}
.do{background:var(--acc2);border:1px solid #D4E2D9}.dont{background:#FFF6F4;border:1px solid #F2D5D0}
.do .lbl{color:var(--acc)}.dont .lbl{color:var(--red)}
.take{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:12px;background:var(--g);color:#fff}
.take svg{width:18px;height:18px;flex-shrink:0;margin-top:2px;color:#C9DCCF}
/* Training stepper */
.tstage{display:grid;grid-template-columns:48px minmax(0,1fr);gap:16px}
.tdot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:650;background:var(--w);border:2px solid var(--b2);color:var(--t2)}
.tdot.done{background:var(--acc);border-color:var(--acc);color:#fff}.tdot.run{border-color:var(--g);color:var(--g)}
.tline{width:2px;background:var(--b);margin:6px auto 0;flex:1;min-height:20px}
.ov{display:none}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr)}
 .journey{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:16px}.journey:before{display:none}}
@media(max-width:900px){.lib{grid-template-columns:minmax(0,1fr)}.rail{display:none}.rail-sel{display:block}}
@media(max-width:820px){.sb{transform:translateX(-100%);box-shadow:none}.sb.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.18)}.ov.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:35}
 .main{margin-left:0}.menu{display:grid}.gs input{width:180px}.page{padding:22px 16px}.top{padding:0 16px}.hero{grid-template-columns:minmax(0,1fr);padding:22px}}
@media(max-width:600px){.g4,.g3,.g2,.dd{grid-template-columns:minmax(0,1fr)}.gs{display:none}.bubble{max-width:92%}h1,.hero h1{font-size:22px}.chat{height:380px}
 .journey{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:18px}.mbox{padding:18px}.modal{padding:8px}.mfoot{bottom:-18px}.search{max-width:none}.stat .v{font-size:26px}}
</style>

 {id:1,cat:'Introduction to Samaqu',title:'Mengenal Samaqu',desc:'Sejarah singkat, visi misi, dan nilai pelayanan Samaqu.',time:10,status:'done',progress:100,
  body:`<h3>Tujuan</h3><p>Admin memahami identitas brand Samaqu sebelum melayani customer.</p><h3>Poin Utama</h3><ul><li>Samaqu adalah brand busana muslim (isi profil resmi perusahaan di sini).</li><li>Nilai pelayanan: ramah, jujur, cepat, dan solutif.</li><li>Admin adalah wajah pertama brand di mata customer.</li></ul><h3>Catatan</h3><p>Lengkapi bagian ini dengan dokumen company profile resmi.</p>`},
 {id:2,cat:'Communication Guidelines',title:'Tone of Voice Samaqu',desc:'Cara berbicara yang hangat, sopan, dan natural dengan customer.',time:15,status:'done',progress:100,
  body:`<h3>Prinsip Komunikasi</h3><ul><li>Gunakan sapaan "Kak" secara konsisten.</li><li>Kalimat singkat, jelas, dan tidak kaku.</li><li>Hindari jawaban menggantung seperti "kita usahakan ya".</li><li>Selalu tawarkan langkah berikutnya.</li></ul><h3>Contoh</h3><p><b>Kurang tepat:</b> "Ready ka."<br><b>Lebih baik:</b> "Ready, Kak 😊 Untuk ukuran berapa yang Kakak cari? Kami bantu cek stoknya."</p>`},
 {id:3,cat:'Customer Service Fundamentals',title:'Dasar Pelayanan Pelanggan',desc:'Empati, active listening, dan respons cepat.',time:20,status:'progress',progress:60,
  body:`<h3>Tiga Pilar Pelayanan</h3><ul><li><b>Empati</b> — pahami perasaan customer sebelum memberi solusi.</li><li><b>Active listening</b> — baca seluruh pesan, tangkap kebutuhan sebenarnya.</li><li><b>Respons tepat waktu</b> — ikuti SLA balasan yang ditetapkan tim.</li></ul><h3>Latihan</h3><p>Coba praktikkan di AI Chat Simulator dengan skenario "Customer baru bertanya produk".</p>`},
 {id:4,cat:'Product Knowledge',title:'Mengenal Lini Produk',desc:'Ringkasan kategori Thobe, Gamis, Koko, dan koleksi bahan.',time:25,status:'progress',progress:35,
  body:`<h3>Kategori Produk</h3><ul><li>Thobe</li><li>Gamis</li><li>Koko</li><li>Fabric Collection</li></ul><p>Detail spesifikasi lengkap ada di halaman <b>Product Knowledge</b>. Gunakan hanya informasi resmi dari tim produk.</p>`},
 {id:5,cat:'Ordering & Payment Process',title:'Alur Order & Pembayaran',desc:'Langkah membantu customer dari checkout hingga konfirmasi bayar.',time:15,status:'todo',progress:0,
  body:`<h3>Langkah</h3><ul><li>Konfirmasi produk, ukuran, dan jumlah.</li><li>Kirim ringkasan pesanan.</li><li>Informasikan metode pembayaran resmi.</li><li>Verifikasi bukti pembayaran.</li><li>Kirim konfirmasi order.</li></ul>`},
 {id:6,cat:'Shipping & Delivery',title:'Informasi Pengiriman',desc:'Menjelaskan estimasi, ekspedisi, dan resi dengan jelas.',time:12,status:'todo',progress:0,

 {id:7,cat:'Complaint Handling',title:'Menangani Komplain',desc:'Kerangka HEARD untuk meredakan dan menyelesaikan keluhan.',time:20,status:'todo',progress:0,

const AFTER={};

function renderNav(){const cur=S.page==='matdetail'?'learning':S.page;
 $('nav').innerHTML=NAV.map(g=>`<div class="ng">${g.g}</div>`+g.items.map(([k,l,i])=>`<button class="ni ${cur===k?'on':''}" onclick="go('${k}')">${ic(i)}${l}</button>`).join('')).join('');
 const rs=$('roleSel');if(rs&&typeof CURRENT_ROLE!=='undefined')rs.value=CURRENT_ROLE;}
function go(p,arg,opts){opts=opts||{};if(p==='assessment'){S.trTab='assessment';p='training';}
 if(!PAGES[p])p='overview';S.page=p;S.arg=arg==null?null:arg;renderNav();toggleSb(false);
 const it=NAV.flatMap(g=>g.items.map(i=>[...i,g.g])).find(x=>x[0]===(p==='matdetail'?'learning':p));
 $('crumb').innerHTML=it?`${esc({'GENERAL':'General','LEARNING & SERVICE':'Learning & Service','DEVELOPMENT':'Development','AI TOOLS':'AI Tools'}[it[3]]||it[3])} / <b>${esc(it[1])}</b>`:'';
 let html='';try{html=PAGES[p](S.arg);}catch(e){console.error(e);html=emptyBox('alert-triangle','Halaman gagal dimuat','Terjadi kesalahan saat menampilkan halaman ini.');}
 $('page').innerHTML=html;icons();if(!opts.keepScroll)window.scrollTo(0,0);if(AFTER[p])AFTER[p](S.arg);
 const h='#/'+p+(S.arg!=null&&S.arg!==''?'/'+encodeURIComponent(S.arg):'');
 if(location.hash!==h){try{history.replaceState(null,'',h);}catch(e){try{S._hashLock=true;location.hash=h;}catch(_){}}}}
function rerender(){go(S.page,S.arg,{keepScroll:true});}
function routeFromHash(){const m=(location.hash||'').match(/^#\/([\w-]+)(?:\/(.+))?/);return m?[m[1],m[2]?decodeURIComponent(m[2]):null]:['overview',null];}
window.addEventListener('hashchange',()=>{if(S._hashLock){S._hashLock=false;return;}const [p,a]=routeFromHash();if(p!==S.page||String(a)!==String(S.arg))go(p,a);});

 DBK[kind]={...cfg,arr};return arr;}

 else if(f.t==='select')inp=`<select class="inp" id="${id}">${dbOpts(f).map(([val,lab])=>`<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`).join('')}</select>`;
 else if(f.t==='multi'){const sel=Array.isArray(v)?v:[];const o=dbOpts(f);inp=o.length?`<div id="${id}" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;max-height:180px;overflow:auto;border:1px solid var(--b);border-radius:9px;padding:10px">${o.map(([val,lab])=>`<label class="row sm" style="gap:7px;align-items:flex-start"><input type="checkbox" value="${esc(val)}" ${sel.includes(val)?'checked':''} style="margin-top:4px">${esc(lab)}</label>`).join('')}</div>`:'<p class="sm muted">Belum ada pilihan.</p>';}
 else if(f.t==='check')inp=`<label class="row sm" style="gap:8px"><input type="checkbox" id="${id}" ${v?'checked':''}>${esc(f.cl||'Ya')}</label>`;
 else inp=`<input class="inp" id="${id}" type="${f.t==='number'?'number':'text'}" ${f.t==='number'?`min="${f.min??0}" ${f.max!=null?`max="${f.max}"`:''}`:''} value="${esc(v)}" placeholder="${esc(f.ph||'')}">`;
 const hint=f.hint||(f.t==='lines'?'Satu poin per baris.':f.t==='chat'?'Satu pesan per baris. Awali "C:" untuk customer dan "A:" untuk admin.':'');
 return `<div style="${f.full||['area','lines','chat','multi'].includes(f.t)?'grid-column:1/-1':''}"><label class="flab" for="${id}">${f.l}${req}</label>${inp}${hint?`<div class="xs muted" style="margin-top:4px">${hint}</div>`:''}<div class="ferr" id="derr_${f.k}"></div></div>`;}

 const c=DBK[kind];const x=id?dbGet(kind,id):{...(c.defaults||{}),...(preset||{})};if(id&&!x){toast('Data tidak ditemukan','err');return;}
 const secs=[...new Set(c.schema.map(f=>f.sec||''))];
 openModal(`<div class="row sp" style="align-items:flex-start"><div><div class="eyebrow">${id?'Edit':'Tambah'}</div><h2>${esc(c.label)}</h2><p class="sm muted">Kolom bertanda * wajib diisi. Data tersimpan sementara di browser ini.</p></div><button class="icb" onclick="closeModal()">${ic('x')}</button></div>
${secs.map(s=>`${s?`<div class="fsec">${s}</div>`:''}<div class="grid g2 fgrid">${c.schema.filter(f=>(f.sec||'')===s).map(f=>dbField(f,x)).join('')}</div>`).join('')}

function dbRead(f){const el=$('df_'+f.k);if(!el)return f.t==='multi'||f.t==='lines'?[]:'';
 if(f.t==='multi')return [...el.querySelectorAll('input:checked')].map(i=>i.value);if(f.t==='check')return !!el.checked;
 const v=String(el.value||'').trim();if(f.t==='lines')return v.split('\n').map(s=>s.trim()).filter(Boolean);if(f.t==='number')return v===''?'':Number(v);return v;}
function dbSaveForm(kind,id){const c=DBK[kind];const d={};let ok=true;
 c.schema.forEach(f=>{const v=dbRead(f);d[f.k]=v;const e=$('derr_'+f.k);const bad=f.req&&(Array.isArray(v)?!v.length:(v===''||v==null));
  if(e){e.style.display=bad?'block':'none';e.textContent=bad?f.l+' wajib diisi':'';}if(bad)ok=false;});

 const arr=c.arr;const bk=arr.slice();if(prev)arr[arr.indexOf(prev)]=rec;else (c.append?arr.push(rec):arr.unshift(rec));
 if(!dbSave(kind)){arr.length=0;arr.push(...bk);return;}
 closeModal();toast(prev?'Perubahan berhasil disimpan':c.label+' berhasil ditambahkan');if(c.after)c.after(rec,!prev);else rerender();}

 return o.map((s,i)=>{const m=SEED_SCRIPT_META[s.cat]||['','',''];return {id:sid('scr'),title:s.title,cat:s.cat,situation:s.situation||m[0],response:s.text||s.response||'',vars:s.vars||[],notes:m[1],tags:[],sample:!s.custom,updated:Date.now()};});}catch(e){return null;}}
function migrateCases(){try{const o=JSON.parse(LS.getItem('smq_cases')||'null');if(!Array.isArray(o)||!o.length||!o.some(c=>c.custom))return null;
 const conv=o.filter(c=>c.custom).map(c=>({id:sid('case'),cat:c.cat,mark:'Materi Pembelajaran',title:c.title,situation:c.situ||'',customerMsg:(c.chat||[]).map(([w,t])=>(w==='a'?'A: ':'')+t).join('\n'),adminPrev:c.wrong||'',finding:c.why||'',cause:'',recommendation:c.best||'',lesson:(c.steps||[]).join('; '),anon:false,updated:Date.now()}));

/* --- Anonimisasi identitas customer --- */
function anonymize(t,names){let s=String(t||'');
 s=s.replace(/[\w.+-]+@[\w-]+\.[\w.]+/g,'[email disamarkan]').replace(/(\+?62|0)8[\d\s.-]{7,14}\d/g,'08xx-xxxx-xxxx');
 s=s.replace(/\b(jl\.?|jalan)\s+[^\n,]{3,40}/gi,'[alamat disamarkan]');
 (names||[]).filter(n=>n&&n.length>=2).forEach(n=>{s=s.replace(new RegExp('\\b'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi'),'[Customer]');});
 return s;}

function slSaveForm(kind,id){const sch=SL_SCHEMA[kind];const d={};let ok=true;
 sch.forEach(f=>{const el=$('sf_'+f.k);let v=el?String(el.value||'').trim():'';const e=$('serr_'+f.k);const bad=f.req&&!v;if(e){e.style.display=bad?'block':'none';e.textContent=bad?f.l+' wajib diisi':'';}if(bad)ok=false;
  if(f.t==='lines')v=v.split('\n').map(s=>s.trim()).filter(Boolean);if(f.t==='tags')v=v.split(',').map(s=>s.trim().replace(/^#/,'')).filter(Boolean);d[f.k]=v;});
 if(!ok){toast('Periksa kembali kolom yang wajib diisi','err');return;}
 if(kind==='case'){const pk=$('sf_privok');if(!pk||!pk.checked){toast('Centang konfirmasi pemeriksaan anonimisasi terlebih dahulu','err');return;}const an=$('sf_anon');d.anon=!!(an&&an.checked);if(d.anon){const names=String(($('sf_names')||{}).value||'').split(',').map(s=>s.trim()).filter(Boolean);
  ['title','situation','customerMsg','adminPrev','finding','cause','recommendation','lesson'].forEach(k=>d[k]=anonymize(d[k],names));}}
 const arr=SL[kind].arr;const prev=id?slGet(kind,id):null;const rec={...(prev||{}),...d,id:prev?prev.id:sid(SL[kind].pre),updated:Date.now()};delete rec.sample;
 const backup=arr.slice();if(prev)arr[arr.indexOf(prev)]=rec;else arr.unshift(rec);
 if(!slSave(kind)){arr.length=0;arr.push(...backup);return;}
 closeModal();toast(id?'Perubahan berhasil disimpan':SL[kind].label+' berhasil ditambahkan');S.scriptTab=kind;if(!prev){S.slCat[kind]='Semua';S.slQ[kind]='';if(kind==='case')S.caseMark='Semua';}go('scripts');}

/* --- IndexedDB untuk foto --- */
const IMG={};let _db=null;
function idb(){return new Promise((res,rej)=>{if(_db)return res(_db);if(!window.indexedDB)return rej('IndexedDB tidak tersedia');const r=indexedDB.open('smq_db',1);
 r.onupgradeneeded=()=>r.result.createObjectStore('images');r.onsuccess=()=>{_db=r.result;res(_db);};r.onerror=()=>rej(r.error);});}
function imgPut(id,data){return idb().then(db=>new Promise((res,rej)=>{const t=db.transaction('images','readwrite');data?t.objectStore('images').put(data,id):t.objectStore('images').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error);}));}
function imgLoadAll(){return idb().then(db=>new Promise(res=>{const t=db.transaction('images','readonly');const st=t.objectStore('images');const rq=st.openCursor();
 rq.onsuccess=()=>{const c=rq.result;if(c){IMG[c.key]=c.value;c.continue();}else res();};rq.onerror=()=>res();})).catch(()=>{});}
function resizeImage(file){return new Promise((res,rej)=>{if(!/^image\//.test(file.type))return rej('File harus berupa gambar');if(file.size>8*1024*1024)return rej('Ukuran gambar maksimal 8 MB');
 const fr=new FileReader();fr.onerror=()=>rej('Gagal membaca file');fr.onload=()=>{const im=new Image();im.onerror=()=>rej('Format gambar tidak didukung');im.onload=()=>{const m=1200,sc=Math.min(1,m/Math.max(im.width,im.height));
  const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85));};im.src=fr.result;};fr.readAsDataURL(file);});}

function prodForm(id,cat){const p=id?{...getP(id)}:{cat:cat||'Thobe'};FORM_IMG=undefined;const c=p.cat;const sch=SCHEMA[c];
 const secs=[...new Set(sch.map(f=>f.sec))];
 openModal(`<div class="row sp"><div><h2>${id?'Edit':'Tambah'} ${c==='Product Series'?'Seri':c==='Fabric Collection'?'Bahan':c==='Size Chart'?'Size Chart':'Produk'}</h2><p class="sm muted">${id?'Perbarui informasi lalu simpan.':'Kolom bertanda * wajib diisi.'}</p></div><button class="icb" onclick="closeModal()">${ic('x')}</button></div>
<div class="mt"><label class="sm" style="display:block;font-weight:500;margin-bottom:4px">Kategori <span style="color:var(--red)">*</span></label>
<select class="inp" id="pf_cat" ${id?'disabled':''} onchange="prodForm(null,this.value)">${PCAT.map(x=>`<option ${x===c?'selected':''}>${x}</option>`).join('')}</select>${id?'<div class="sm muted" style="margin-top:3px">Kategori tidak dapat diubah setelah data dibuat.</div>':'<div class="sm muted" style="margin-top:3px">Kolom form menyesuaikan kategori yang dipilih.</div>'}</div>
${secs.map(s=>`<h3 class="mt2" style="padding-bottom:6px;border-bottom:1px solid var(--b)">${s}</h3><div class="grid g2 mt" style="gap:14px">${sch.filter(f=>f.sec===s).map(f=>fieldHTML(f,p)).join('')}</div>`).join('')}
<h3 class="mt2" style="padding-bottom:6px;border-bottom:1px solid var(--b)">Media</h3>
<label class="sm" style="display:block;font-weight:500;margin:12px 0 4px">${PHOTO_LABEL[c]||'Foto Produk'}</label>
<div id="pf_imgbox"></div><input type="file" id="pf_file" accept="image/*" style="display:none" onchange="pickImg(this)">
<div class="row mt2" style="justify-content:flex-end;border-top:1px solid var(--b);padding-top:16px"><button class="btn" onclick="closeModal()">Batal</button><button class="btn p" id="pf_save" onclick="saveProd(${id?`'${id}'`:'null'},'${c}')">${ic('check')}Simpan</button></div>`,true);
 drawImgBox(id);}
function drawImgBox(id){const cur=FORM_IMG===undefined?(id?IMG[id]:null):FORM_IMG;const b=$('pf_imgbox');if(!b)return;
 b.innerHTML=cur?`<div class="row" style="align-items:flex-start;gap:14px;flex-wrap:wrap"><img src="${cur}" alt="Preview" style="width:180px;height:180px;object-fit:cover;border-radius:10px;border:1px solid var(--b)"><div class="row wrap"><button class="btn sm" onclick="$('pf_file').click()">${ic('refresh-cw')}Ganti Foto</button><button class="btn sm" style="color:var(--red)" onclick="FORM_IMG=null;drawImgBox('${id||''}')">${ic('trash-2')}Hapus Foto</button></div></div>`
 :`<div onclick="$('pf_file').click()" style="border:1.5px dashed var(--b);border-radius:10px;padding:26px;text-align:center;cursor:pointer;color:var(--t2)">${ic('image-plus','width:26px;height:26px')}<div class="sm mt1"><b>Klik untuk upload gambar</b></div><div class="sm muted">JPG/PNG/WebP, maks 8 MB. Gambar dikompres otomatis.</div></div>`;icons();}
function pickImg(inp){const f=inp.files&&inp.files[0];if(!f)return;const id=(inp.closest&&'')||'';resizeImage(f).then(d=>{FORM_IMG=d;drawImgBox(S._editing||'');toast('Preview gambar siap');}).catch(e=>toast('Gagal: '+e));inp.value='';}
function readField(f){const el=$('pf_'+f.k);if(!el)return '';if(f.t==='members')return [...el.querySelectorAll('input:checked')].map(x=>x.value);return el.value.trim();}
function saveProd(id,cat){const sch=SCHEMA[cat];const data={};let ok=true;
 sch.forEach(f=>{data[f.k]=readField(f);const e=$('err_'+f.k);if(e){const bad=f.req&&!data[f.k];e.style.display=bad?'block':'none';e.textContent=bad?f.l+' wajib diisi':'';if(bad)ok=false;}});
 if(data.price&&Number(data.price)<0){ok=false;toast('Harga tidak boleh negatif');}
 if(data.code){const dup=PRODUCTS.find(x=>x.id!==id&&x.cat===cat&&String(x.code).toLowerCase()===data.code.toLowerCase());if(dup){ok=false;const e=$('err_code');if(e){e.style.display='block';e.textContent='Kode sudah dipakai oleh "'+dup.name+'"';}}}
 if(!ok){toast('Periksa kembali kolom yang wajib diisi');return;}
 const pid=id||uid();const prev=id?getP(id):null;const rec={...(prev||{}),...data,id:pid,cat,updated:Date.now()};if(prev)delete rec.sample;
 const backup=PRODUCTS.slice();if(prev)PRODUCTS[PRODUCTS.indexOf(prev)]=rec;else PRODUCTS.unshift(rec);
 if(!saveProducts()){PRODUCTS=backup;return;}
 const done=()=>{closeModal();toast(id?'Perubahan berhasil disimpan':'Data berhasil ditambahkan');S.prodCat=S.prodCat==='Semua'?'Semua':cat;if(S.page==='products')drawProd();else go('products');};
 if(FORM_IMG===undefined)return done();
 imgPut(pid,FORM_IMG).then(()=>{if(FORM_IMG)IMG[pid]=FORM_IMG;else delete IMG[pid];done();}).catch(()=>{toast('Data tersimpan, tetapi foto gagal disimpan di browser');done();});}
function confirmDelProd(id){const p=getP(id);openModal(`<div style="text-align:center;padding:8px 4px"><div class="sic" style="margin:0 auto;width:44px;height:44px;background:var(--redl);color:var(--red)">${ic('trash-2')}</div>
<h2 class="mt">Apakah Anda yakin ingin menghapus produk ini?</h2><p class="sm muted mt1">"${esc(p.name)}" akan dihapus dari Product Knowledge. Tindakan ini tidak dapat dibatalkan.</p>
<div class="row mt2" style="justify-content:center"><button class="btn" onclick="closeModal()">Batal</button><button class="btn p" style="background:var(--red);border-color:var(--red)" onclick="delProd('${id}')">${ic('trash-2')}Hapus</button></div></div>`);}
function delProd(id){const i=PRODUCTS.findIndex(p=>p.id===id);if(i<0)return;PRODUCTS.splice(i,1);PRODUCTS.forEach(p=>{if(p.members)p.members=p.members.filter(m=>m!==id);});
 if(!saveProducts())return;imgPut(id,null).catch(()=>{});delete IMG[id];closeModal();toast('Data berhasil dihapus');drawProd();}
/* track id yang sedang diedit untuk preview gambar */
const _pf=prodForm;prodForm=function(id,cat){S._editing=id||'';_pf(id,cat);};
loadProducts();imgLoadAll().then(()=>{if(S.page==='products')drawProd();});

 price:['Price Inquiry','Customer merasa harga lebih mahal dari toko lain.','Menjawab keberatan harga dengan empati dan menjelaskan nilai produk.','mat_3'],
 ship:['Shipping Information','Customer ingin pesanan dikirim hari ini untuk acara lusa.','Mengelola ekspektasi tanpa janji yang belum pasti.','mat_6'],
 doubt:['Product Inquiry','Customer ragu membeli karena takut bahan tidak sesuai foto.','Membangun kepercayaan dengan bukti visual dan informasi yang jujur.','mat_4'],

 defaults:{cat:SCAT[0],lvl:'Mudah'},
 schema:[{k:'title',l:'Judul Skenario',req:1,full:1},{k:'cat',l:'Kategori',t:'select',o:()=>SCAT,req:1},{k:'lvl',l:'Tingkat Kesulitan',t:'select',o:['Mudah','Sedang','Sulit'],req:1},
  {k:'situation',l:'Situasi Customer',t:'area',req:1,rows:2},{k:'objective',l:'Tujuan Pembelajaran',t:'area',req:1,rows:2},

const lvlTag=l=>`<span class="tag ${l==='Sulit'?'rd':l==='Sedang'?'yl':'gr'}">${l}</span>`;
PAGES.simulator=()=>{if(S.sim)return simChat();const A=DBK.scenario.arr;const cats=[...new Set(A.map(s=>s.cat))];
 return pageHead('Learning & Service','Chat Scenario','Latihan percakapan: customer dimainkan oleh simulasi berbasis skenario, kamu berperan sebagai admin.',`${demoBadge('Simulasi lokal · bukan AI')}${can('manage')?`<button class="btn p" onclick="dbForm('scenario')">${ic('plus')}Tambah Skenario</button>`:''}`)+
`<div class="note nt" style="margin-bottom:18px">${ic('info')}<div>Balasan customer diambil dari alur pesan yang sudah ditentukan per skenario, dan skornya dihitung dengan aturan sederhana di browser. Ini mode demo sampai layanan AI server dihubungkan.</div></div>
<div class="toolbar"><select class="inp auto" onchange="S.scnCat=this.value;drawScn()"><option value="Semua">Semua kategori</option>${cats.map(c=>`<option ${S.scnCat===c?'selected':''}>${c}</option>`).join('')}</select><div class="seg" id="scnSeg"></div></div><div class="grid g3" id="scnGrid"></div>`;};
function drawScn(){if(!$('scnGrid'))return;const A=DBK.scenario.arr;$('scnSeg').innerHTML=['Semua','Mudah','Sedang','Sulit'].map(l=>`<button class="${S.scnLvl===l?'on':''}" onclick="S.scnLvl='${l}';drawScn()">${l}</button>`).join('');
 const l=A.filter(s=>(S.scnCat==='Semua'||s.cat===S.scnCat)&&(S.scnLvl==='Semua'||s.lvl===S.scnLvl));
 const tries=id=>THIST.filter(h=>h.type==='scenario'&&h.ref===id);
 $('scnGrid').innerHTML=l.length?l.map(s=>{const t=tries(s.id);const best=t.length?Math.max(...t.map(x=>x.score||0)):null;return `<div class="card" style="display:flex;flex-direction:column"><div class="row sp"><span class="sic">${ic(scnIcon(s.cat))}</span>${lvlTag(s.lvl)}</div>
<h3 class="mt" style="font-size:15.5px">${esc(s.title)}</h3><div class="xs muted">${esc(s.cat)} · ${s.msgs.length} putaran</div><p class="sm muted mt1" style="flex:1">${esc(s.situation)}</p>
${best!=null?`<div class="xs mt1">Skor terbaik: <b>${best}</b> · ${t.length}x latihan</div>`:''}
<div class="row mt wrap"><button class="btn p sm" onclick="startSim('${s.id}')">${ic('play')}Mulai</button><button class="btn sm" onclick="previewScn('${s.id}')">${ic('eye')}Preview</button>${ownerBtns('scenario',s.id)}</div></div>`;}).join(''):`<div style="grid-column:1/-1">${emptyBox('messages-square','Tidak ada skenario','Ubah filter atau tambahkan skenario baru.')}</div>`;icons();}
AFTER.simulator=()=>{drawScn();const c=$('chat');if(c)c.scrollTop=c.scrollHeight;const i=$('simIn');if(i&&i.focus)i.focus();};
function previewScn(id){const s=dbGet('scenario',id);const m=s.material&&dbGet('material',s.material);
 openModal(`<div class="row sp"><div class="row" style="gap:6px"><span class="tag">${esc(s.cat)}</span>${lvlTag(s.lvl)}</div><button class="icb" onclick="closeModal()">${ic('x')}</button></div>
<h2 class="mt">${esc(s.title)}</h2><div class="grid g2 mt"><div class="card soft"><div class="kh">${ic('user')}<h3>Situasi Customer</h3></div><p class="sm">${esc(s.situation)}</p></div><div class="card soft"><div class="kh">${ic('target')}<h3>Tujuan Pembelajaran</h3></div><p class="sm">${esc(s.objective)}</p></div></div>
<div class="mt2"><div class="kh">${ic('messages-square')}<h3>Alur Pesan Customer</h3></div><div class="convo">${s.msgs.map((t,i)=>`<div><div class="who">Putaran ${i+1}</div><div class="bubble bc">${esc(t)}</div></div>`).join('')}</div></div>
${m?`<button class="ref mt" onclick="closeModal();go('matdetail','${m.id}')">${ic('book-open')}<span style="flex:1">Materi terkait: ${esc(m.title)}</span>${ic('chevron-right')}</button>`:''}
<div class="mfoot"><button class="btn" onclick="closeModal()">Tutup</button><button class="btn p" onclick="closeModal();startSim('${id}')">${ic('play')}Mulai Simulasi</button></div>`,true);}
function startSim(id){const sc=dbGet('scenario',id);if(!sc){toast('Skenario tidak ditemukan','err');return;}S.sim={sc,turn:0,log:[['c',sc.msgs[0]]],ended:false,busy:false};go('simulator');}
function simChat(){const s=S.sim,sc=s.sc;const m=sc.material&&dbGet('material',sc.material);
 return `<div class="row sp wrap" style="margin-bottom:18px"><button class="btn ghost" onclick="S.sim=null;go('simulator')">${ic('arrow-left')}Semua skenario</button><div class="row">${demoBadge()}${s.ended?'':`<button class="btn" onclick="endSim()">${ic('square')}Akhiri &amp; Evaluasi</button>`}</div></div>
<div class="split"><div class="card"><div class="row sp wrap"><div><div class="eyebrow">${esc(sc.cat)}</div><h2>${esc(sc.title)}</h2></div><div class="row">${lvlTag(sc.lvl)}<span class="tag">Putaran ${Math.min(s.turn+1,sc.msgs.length)}/${sc.msgs.length}</span></div></div>
<div class="chat mt" id="chat">${s.log.map(([w,t])=>`<div style="display:flex;flex-direction:column;align-items:${w==='c'?'flex-start':'flex-end'}"><div class="who">${w==='c'?'Customer (simulasi)':'Kamu'}</div><div class="bubble ${w==='c'?'bc':'ba'}">${esc(t)}</div></div>`).join('')}${s.busy?'<div class="bubble bc typing"><span></span><span></span><span></span></div>':''}${s.done&&!s.ended?'<div class="xs muted" style="text-align:center">Customer sudah selesai. Klik "Akhiri & Evaluasi".</div>':''}</div>
${s.ended?'':`<div class="cin"><input class="inp" id="simIn" placeholder="Ketik balasan sebagai admin…" onkeydown="if(event.key==='Enter')sendSim()" ${s.busy||s.done?'disabled':''}><button class="btn p" onclick="sendSim()" ${s.done?'disabled':''}>${ic('send')}</button></div>`}</div>
<div class="card" id="simSide">${s.ended?simEval():`<div class="kh">${ic('user')}<h3>Situasi</h3></div><p class="sm">${esc(sc.situation)}</p><div class="kh mt">${ic('target')}<h3>Tujuan</h3></div><p class="sm">${esc(sc.objective)}</p>
<div class="note gn mt">${ic('lightbulb')}<div>Sapa dengan hangat, gali kebutuhan, beri informasi dari data resmi, lalu arahkan ke langkah berikutnya.</div></div>
${m?`<button class="ref mt" onclick="go('matdetail','${m.id}')">${ic('book-open')}<span style="flex:1">${esc(m.title)}</span>${ic('chevron-right')}</button>`:''}<button class="ref" onclick="S.scriptTab='script';S.slCat.script='${esc(sc.cat)}';go('scripts')">${ic('message-square-text')}<span style="flex:1">Script ${esc(sc.cat)}</span>${ic('chevron-right')}</button>`}</div></div>`;}
function sendSim(){const s=S.sim,i=$('simIn');if(!s||!i)return;const v=String(i.value||'').trim();if(!v||s.busy||s.done)return;s.log.push(['a',v]);s.turn++;s.busy=true;go('simulator');
 AIService.nextCustomerMessage(s.sc,s.turn).then(msg=>{if(S.sim!==s)return;s.busy=false;if(msg)s.log.push(['c',msg]);if(!msg)s.done=true;go('simulator');if(s.done)toast('Percakapan selesai. Klik "Akhiri & Evaluasi".');});}
function endSim(){const s=S.sim;if(!s.log.some(x=>x[0]==='a')){toast('Kirim minimal satu balasan sebelum evaluasi','err');return;}
 AIService.reviewConversation(s.log).then(r=>{s.ended=true;s.res=r;logActivity('scenario',s.sc.title,r.overall,s.sc.id);go('simulator');});}
function simEval(){const r=S.sim.res;const m=S.sim.sc.material&&dbGet('material',S.sim.sc.material);
 return `<div class="row" style="gap:16px">${scoreRing(r.overall,'Skor')}<div><h3>Evaluasi Simulasi</h3><p class="xs muted">${r.nAdmin} balasan · skor heuristik lokal</p></div></div>
<div>${bars(r.dims.filter(d=>['Pemahaman konteks','Kejelasan','Naturalitas','Empati','Proaktif','Manajemen ekspektasi','Closing'].includes(d[0])))}</div>
<h3 class="mt2">Saran Perbaikan</h3><ul class="dots mt1">${(r.improve.length?r.improve:['Pertahankan! Coba skenario dengan tingkat kesulitan lebih tinggi.']).slice(0,5).map(x=>`<li>${ic('arrow-right','color:var(--warn)')}${esc(x)}</li>`).join('')}</ul>
${r.good.length?`<h3 class="mt">Sudah Baik</h3><ul class="dots mt1">${r.good.slice(0,4).map(x=>`<li>${ic('check','color:var(--acc)')}${esc(x)}</li>`).join('')}</ul>`:''}
${m?`<button class="ref mt" onclick="go('matdetail','${m.id}')">${ic('book-open')}<span style="flex:1">Pelajari: ${esc(m.title)}</span>${ic('chevron-right')}</button>`:''}
<div class="row mt wrap"><button class="btn p" onclick="startSim('${S.sim.sc.id}')">${ic('rotate-ccw')}Ulangi</button><button class="btn" onclick="S.sim=null;go('simulator')">Skenario lain</button></div>`;}

const QTYPES=['Multiple choice','Studi kasus','Pilih respons terbaik'];

dbReg('quiz',{key:'smq_quiz_v1',label:'Soal',pre:'q',append:true,
 seed:()=>QUIZ.map((q,i)=>({id:'q_seed'+i,type:q.type==='Pilih respons terbaik'?q.type:q.type,cat:QCAT_SEED[i]||MCAT[0],q:q.q,options:q.o.slice(),correct:q.c+1,ex:q.ex,sample:true,updated:Date.now()})),
 defaults:{type:QTYPES[0],cat:MCAT[0]},
 schema:[{k:'type',l:'Jenis Soal',t:'select',o:QTYPES,req:1},{k:'cat',l:'Kategori',t:'select',o:()=>MCAT,req:1},{k:'q',l:'Pertanyaan / Studi Kasus',t:'area',req:1,rows:3},
  {k:'options',l:'Pilihan Jawaban',t:'lines',req:1,hint:'2–6 pilihan, satu per baris.'},{k:'correct',l:'Nomor Jawaban Benar',t:'number',req:1,min:1,max:6},{k:'ex',l:'Pembahasan',t:'area',req:1,rows:3}],
 validate:d=>d.options.length<2||d.options.length>6?'Pilihan jawaban harus 2 sampai 6':(d.correct<1||d.correct>d.options.length?'Nomor jawaban benar harus antara 1 dan '+d.options.length:null),
 after:()=>{S.trTab='assessment';go('training');}});
const ASET_KEY='smq_assessment_settings_v1';const ASET=kvLoad(ASET_KEY,{pass:75});
const passMark=()=>Number(ASET.pass)||75;
const AHIST=dbReg('ahist',{key:'smq_assessment_history_v1',label:'Hasil',pre:'att',seed:()=>[]});
const bestScore=()=>AHIST.length?Math.max(...AHIST.map(a=>a.score)):null;
const flowSeen=ids=>ids.every(id=>!dbGet('flow',id)||PROG.flow[id]);
const TRAINING=[
 {id:'t1',title:'Orientation',obj:['Mengenal Samaqu dan nilai pelayanannya','Memahami peran admin CS sebagai wajah brand'],cats:['Introduction to Samaqu'],tasks:[]},
 {id:'t2',title:'Communication & Customer Service Fundamentals',obj:['Berkomunikasi natural sesuai tone Samaqu','Menerapkan empati dan memahami konteks'],cats:['Communication Guidelines','Customer Service Fundamentals'],
  tasks:[{label:'Pahami semua bagian Communication Guidelines',act:"go('guidelines')",min:25,done:()=>DBK.guide.arr.length>0&&guideDoneCount()>=DBK.guide.arr.length}]},
 {id:'t3',title:'Product Knowledge & Consultation',obj:['Menjelaskan produk berdasarkan data resmi','Merekomendasikan ukuran dan seri yang tepat'],cats:['Product Knowledge'],
  tasks:[{label:'Pelajari tahap Chat Flow 1–4',act:"go('flow')",min:15,done:()=>flowSeen(['flow_1','flow_2','flow_3','flow_4'])},{label:'Jelajahi Product Knowledge',act:"go('products')",min:15,done:()=>!!PROG.visitedProducts}]},
 {id:'t4',title:'Order & Payment Process',obj:['Membuat ringkasan pesanan yang akurat','Memverifikasi pembayaran dengan benar'],cats:['Ordering & Payment Process'],
  tasks:[{label:'Pelajari tahap Checkout & Order Confirmation',act:"go('flow')",min:10,done:()=>flowSeen(['flow_5','flow_6'])}]},
 {id:'t5',title:'Shipping & After Sales',obj:['Menginformasikan pengiriman tanpa janji berlebihan','Melakukan follow up purna jual'],cats:['Shipping & Delivery','After Sales Service'],
  tasks:[{label:'Pelajari tahap After Sales',act:"go('flow')",min:5,done:()=>flowSeen(['flow_7'])}]},
 {id:'t6',title:'Problem Solving',obj:['Menangani komplain dengan HEARD','Tahu kapan harus eskalasi'],cats:['Complaint Handling'],
  tasks:[{label:'Pelajari minimal 5 kasus Problem Solving',act:"go('problems')",min:30,done:()=>Object.keys(PROG.prob).filter(id=>dbGet('problem',id)).length>=5},{label:'Pelajari jalur Complaint Handling di Chat Flow',act:"S.flow='flow_8';go('flow')",min:5,done:()=>flowSeen(['flow_8'])}]},
 {id:'t7',title:'Practical Chat Scenario',obj:['Mempraktikkan percakapan dari awal sampai akhir','Lulus assessment akhir'],cats:[],
  tasks:[{label:'Selesaikan 3 Chat Scenario berbeda',act:"go('simulator')",min:30,done:()=>new Set(THIST.filter(h=>h.type==='scenario'&&h.ref).map(h=>h.ref)).size>=3},{label:'Lulus Assessment',act:"S.trTab='assessment';go('training')",min:15,done:()=>bestScore()!=null&&bestScore()>=passMark()}]}];
function stageProgress(t){const mats=DBK.material.arr.filter(m=>t.cats.includes(m.cat));const items=[...mats.map(m=>({kind:'mat',m,done:matSt(m.id).status==='done'})),...t.tasks.map(k=>({kind:'task',k,done:!!k.done()}))];
 const d=items.filter(x=>x.done).length;const min=mats.reduce((a,m)=>a+(Number(m.time)||0),0)+t.tasks.reduce((a,k)=>a+k.min,0);
 return {items,done:d,total:items.length,pct:items.length?Math.round(d/items.length*100):0,min};}
function trainingProgress(){const ps=TRAINING.map(stageProgress);const t=ps.reduce((a,p)=>a+p.total,0),d=ps.reduce((a,p)=>a+p.done,0);return t?Math.round(d/t*100):0;}
function nextStep(){for(const t of TRAINING){const p=stageProgress(t);const it=p.items.find(x=>!x.done);if(it)return it.kind==='mat'?{label:'Lanjut: '+it.m.title,act:`go('matdetail','${it.m.id}')`}:{label:'Lanjut: '+it.k.label,act:it.k.act};}return {label:'Ulangi latihan Chat Scenario',act:"go('simulator')"};}
PAGES.training=()=>{const tabs=[['path','Training Path','route'],['assessment','Assessment','clipboard-check'],['results','Results & Certification','award']];
 return pageHead('Development','Training &amp; Assessment','Jalur belajar terstruktur untuk admin CS baru: pelajari, latih, lalu uji pemahamanmu.')+
 `<div class="seg" style="margin-bottom:20px">${tabs.map(([k,l,i])=>`<button class="${S.trTab===k?'on':''}" onclick="S.trTab='${k}';go('training')">${ic(i)}${l}</button>`).join('')}</div>`+
 (S.trTab==='assessment'?assessView():S.trTab==='results'?resultsView():pathView());};
function pathView(){const tp=trainingProgress();
 return `<div class="card row wrap" style="gap:20px;margin-bottom:18px">${scoreRing(tp,'Selesai')}<div style="flex:1;min-width:220px"><h2>Progress Training</h2><p class="sm muted">${TRAINING.filter(t=>stageProgress(t).pct===100).length} dari ${TRAINING.length} tahap selesai. Ikuti urutan tahap agar pemahaman terbangun bertahap.</p></div><button class="btn p" onclick="${nextStep().act}">${ic('play')}${esc(nextStep().label)}</button></div>`+
 TRAINING.map((t,i)=>{const p=stageProgress(t);const stt=p.pct===100?'Selesai':p.done>0?'Berjalan':'Belum mulai';
 return `<div class="tstage"><div style="display:flex;flex-direction:column;align-items:center"><div class="tdot ${p.pct===100?'done':p.done?'run':''}">${p.pct===100?ic('check','width:16px'):i+1}</div>${i<TRAINING.length-1?'<div class="tline"></div>':''}</div>
<div class="card" style="margin-bottom:14px"><div class="row sp wrap"><div><div class="eyebrow">Tahap ${i+1}</div><h2>${esc(t.title)}</h2></div><div class="row"><span class="tag ${p.pct===100?'gr':p.done?'yl':''}">${stt}</span><span class="tag">${ic('clock')}±${p.min} menit</span></div></div>

const kaTok=s=>String(s||'').toLowerCase().replace(/[\[\]().,?!:;"']/g,' ').split(/\s+/).filter(w=>(w.length>=3||/^\d+$/.test(w))&&!KA_STOP.has(w));
const kaVal=v=>v==null||v===''||(Array.isArray(v)&&!v.length)?'':v;

function kaLink(p){return `<a href="#" onclick="event.preventDefault();openProd('${p.id}')" style="color:inherit;font-weight:600">${esc(p.name)}</a>`;}
function kaFind(q){const l=q.toLowerCase();
 const byCode=PRODUCTS.filter(p=>p.code&&new RegExp('(^|[^a-z0-9])'+p.code.toLowerCase().replace(/[-]/g,'\\-')+'($|[^a-z0-9])').test(l));
 if(byCode.length)return byCode;
 const qt=kaTok(q);if(!qt.length)return [];
 const sc=PRODUCTS.map(p=>{const t=kaTok([p.name,p.series,p.fabric,p.composition].join(' '));const n=qt.filter(w=>t.includes(w)).length;return {p,n};}).filter(x=>x.n>0);
 const max=Math.max(0,...sc.map(x=>x.n));return sc.filter(x=>x.n===max&&(max>=2||qt.length<=2)).map(x=>x.p).slice(0,4);}
function kaDetail(p,l){const f=(SCHEMA[p.cat]||[]).filter(x=>!['name'].includes(x.k));let rows=f;
 if(/harga|price|berapa/.test(l)&&isGarment(p.cat))rows=f.filter(x=>['price','status','sizes','colors'].includes(x.k));

 else if(/warna|varian/.test(l)&&isGarment(p.cat))rows=f.filter(x=>['colors','status'].includes(x.k));

 return `<div style="margin-top:6px"><b>${kaLink(p)}</b> <span class="tag">${p.cat}</span>${p.code?` <span class="muted sm">${esc(p.code)}</span>`:''}${p.sample?' <span class="tag yl">Data contoh</span>':''}</div>

 return `<div style="overflow-x:auto;margin-top:6px"><table style="font-size:12.5px"><tr><th></th>${ps.map(p=>`<th>${kaLink(p)}</th>`).join('')}</tr>${keys.map(k=>`<tr><th style="padding:6px 8px">${lab(k)}</th>${ps.map(p=>`<td style="padding:6px 8px">${cell(p,k)}</td>`).join('')}</tr>`).join('')}</table></div>`;}
function kaProductAnswer(q){const l=q.toLowerCase();const hits=kaFind(q);
 const catW={thobe:'Thobe',gamis:'Gamis',koko:'Koko','size chart':'Size Chart',seri:'Product Series',series:'Product Series','bahan':'Fabric Collection',fabric:'Fabric Collection'};
 const listQ=/(apa saja|daftar|list|ada apa|semua|pilihan)/.test(l);
 let html='',src=[];
 const cK=Object.keys(catW).find(k=>l.includes(k));
 if(listQ&&cK&&!kaFind(q).some(p=>p.code&&l.includes(p.code.toLowerCase()))){const ps=PRODUCTS.filter(p=>p.cat===catW[cK]);src=ps;html=ps.length?`Ada ${ps.length} data di kategori <b>${catW[cK]}</b>:<ul style="padding-left:18px;margin-top:4px">${ps.map(p=>`<li>${kaLink(p)}${p.code?' · '+esc(p.code):''}${p.status?' · '+esc(p.status):''}</li>`).join('')}</ul>`:`Belum ada data di kategori <b>${catW[cK]}</b>. Tambahkan di menu Product Knowledge.`;}
 else if(hits.length>=2&&/(beda|perbedaan|banding|vs|versus|atau)/.test(l)){html=`Berikut perbandingan dari data Product Knowledge:${kaCompare(hits)}`;src=hits;}
 else if(hits.length){html=hits.map(p=>kaDetail(p,l)).join('');src=hits;

const kaTok2=s=>String(s||'').toLowerCase().replace(/[\[\]().,?!:;"'&/]/g,' ').split(/\s+/).filter(w=>w.length>=3&&!KA_STOP2.has(w));
const KA_CATSYN=[[/komplain|keluh|kecewa|rusak|cacat|jahit/,'Complaint Handling'],[/kirim|pengiriman|ongkir|resi|ekspedisi|cepat|sampai/,'Shipping Information'],[/bayar|pembayaran|transfer|lunas/,'Payment Confirmation'],[/order|pesan|checkout/,'Ordering'],[/follow|menghilang|tidak membalas|gak bales/,'Follow Up'],[/sapa|salam|greeting|opening|pembuka/,'Greeting & Opening'],[/ukuran|size|kekecilan|kebesaran/,'Size Consultation'],[/bahan|kain|fabric|panas|adem/,'Fabric Inquiry'],[/harga|mahal|diskon|murah|promo/,'Price Inquiry'],[/create your price|cyp/,'Create Your Price'],[/refund|retur|tukar|purna|after sales/,'After Sales'],[/stok|ready|tersedia|produk/,'Product Inquiry']];
function kaScore(q,text,cat){const l=q.toLowerCase();const qt=[...new Set(kaTok2(q))];const tt=kaTok2(text);let n=qt.filter(w=>tt.some(t=>t===w||(w.length>=5&&t.startsWith(w.slice(0,5))))).length;
 if(KA_CATSYN.some(([re,c])=>c===cat&&re.test(l)))n+=2;return n;}
function kaScriptCase(q){const sc=SCRIPTS.map(s=>({s,n:kaScore(q,[s.title,s.situation,s.response,(s.vars||[]).join(' '),(s.tags||[]).join(' ')].join(' '),s.cat)})).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n).slice(0,2);
 const cs=CASES.map(c=>({c,n:kaScore(q,[c.title,c.situation,c.customerMsg,c.adminPrev,c.finding].join(' '),c.cat)})).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n).slice(0,2);
 const bs=BA.map(b=>({b,n:kaScore(q,[b.title,b.before,b.after].join(' '),b.cat)})).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n).slice(0,1);
 if(!sc.length&&!cs.length&&!bs.length)return null;
 const box=s=>`<div style="border:1px solid var(--b);border-radius:9px;padding:10px 12px;margin-top:6px">${s}</div>`;
 let h='';
 if(cs.length)h+=`<div style="margin-top:6px"><b>Studi kasus terkait</b></div>`+cs.map(({c})=>box(`<div class="row sp"><a href="#" onclick="event.preventDefault();openCase('${c.id}')" style="color:inherit;font-weight:600">${esc(c.title)}</a><span class="row" style="gap:4px">${markTag(c.mark)}</span></div>
${c.adminPrev&&c.mark==='Perlu Perbaikan'?`<div class="sm mt1"><span style="color:var(--red)">Hindari:</span> ${esc(c.adminPrev)}</div>`:''}
<div class="after sm mt1">${esc(c.recommendation)}</div><div class="sm muted mt1"><b>Pelajaran:</b> ${esc(c.lesson)}</div><button class="btn sm mt1" onclick="slCopy('case','${c.id}','recommendation')">${ic('copy')}Copy respons</button>`)).join('');

 if(bs.length)h+=`<div style="margin-top:10px"><b>Before &amp; After</b></div>`+bs.map(({b})=>box(`<b class="sm">${esc(b.title)}</b><div class="before sm mt1">${esc(b.before)}</div><div class="after sm mt1">${esc(b.after)}</div><div class="sm muted mt1">${esc(b.why)}</div>`)).join('');
 return {h,n:sc.length+cs.length+bs.length};}

const wait=ms=>new Promise(r=>setTimeout(r,ms));
const AIService={provider:'local-demo',

 nextCustomerMessage:(scn,turn)=>wait(800).then(()=>scn.msgs[turn]||null),

function localReview(msgs){
 const A=msgs.filter(m=>m[0]==='a').map(m=>String(m[1]||'')),C=msgs.filter(m=>m[0]==='c').map(m=>String(m[1]||''));
 const all=A.join(' \n ').toLowerCase(),cAll=C.join(' ').toLowerCase();const cnt=re=>(all.match(re)||[]).length;
 const pairs=[];msgs.forEach((m,i)=>{if(m[0]==='c'){const nx=msgs.slice(i+1).find(x=>x[0]==='a');pairs.push([m[1],nx?nx[1]:null]);}});
 const qs=pairs.filter(p=>/\?|gimana|berapa|bisa|ada gak|apa |kapan/.test(String(p[0]).toLowerCase()));const answered=qs.filter(p=>p[1]&&p[1].trim().length>=15).length;
 const ctx=qs.length?45+55*answered/qs.length:72;
 const relArr=pairs.filter(p=>p[1]).map(p=>{const a=kaTok2(p[0]),b=kaTok2(p[1]);return a.length?a.filter(w=>b.some(t=>t.slice(0,4)===w.slice(0,4))).length/a.length:1;});
 const rel=relArr.length?40+60*(relArr.reduce((x,y)=>x+y,0)/relArr.length):55;
 const avg=A.length?A.reduce((x,y)=>x+y.length,0)/A.length:0;const short=A.filter(a=>a.trim().length<15).length,long=A.filter(a=>a.length>400).length;
 const clar=85-short*14-long*10-(avg<20?10:0);
 const repeated=cnt(/oke baik/g)+Math.max(0,cnt(/mohon ditunggu/g)-1);const formal=cnt(/dengan hormat|sehubungan dengan|demikian|kami informasikan bahwa/g);const kak=/\bkak\b/.test(all);
 const emo=(A.join('').match(/\p{Extended_Pictographic}/gu)||[]).length;const nat=80+(kak?8:-12)-repeated*10-formal*12-(emo>A.length*2?10:0);
 const empW=cnt(/maaf|paham|mengerti|terima kasih|makasih/g);const complaint=/kecewa|rusak|lepas|marah|lama|belum sampai|komplain|refund/.test(cAll);
 let emp=58+Math.min(3,empW)*11;if(complaint&&!/maaf|paham|mengerti/.test(all))emp=32;if(cnt(/maaf/g)>3)emp-=12;
 const asks=cnt(/\?/g),offer=cnt(/kami (bantu|cek|kirim|kabari)|mau kami|boleh (info|kirim|dibantu)/g);const pro=42+Math.min(3,asks)*10+Math.min(3,offer)*9;
 const codes=(all.match(/\b[a-z]{1,3}-\d{2,3}\b/gi)||[]).map(x=>x.toUpperCase());const unknown=codes.filter(c=>!PRODUCTS.some(p=>String(p.code||'').toUpperCase()===c));
 const claims=cnt(/\b(adem|pasti|dijamin|100%|paling bagus)\b/g);const prodCtx=/bahan|ukuran|size|stok|ready|warna|harga|thobe|gamis|koko/.test(cAll);
 const pa=prodCtx?86-unknown.length*20-claims*14:null;
 const orderCtx=/order|pesan|checkout|alamat|transfer|bayar|ongkir|ambil yang/.test(cAll);
 const oa=orderCtx?45+['ukuran','alamat','jumlah','warna','ringkasan','nama penerima'].filter(w=>all.includes(w)).length*11:null;
 const last=(A[A.length-1]||'').toLowerCase();const clo=/ada lagi|kabari|silakan|mau kami|boleh|semoga|terima kasih|sama-sama|\?/.test(last)?84:48;
 const vague=cnt(/usahakan|secepatnya|pasti sampai|dijamin/g),gexp=cnt(/kami kabari|setelah ada kepastian|estimasi|kami cek/g);const exp=70-vague*18+Math.min(2,gexp)*10;
 const D=[['Pemahaman konteks',ctx,qs.length?`${answered}/${qs.length} pertanyaan customer dijawab dengan cukup jelas`:'Tidak banyak pertanyaan eksplisit'],
  ['Relevansi jawaban',rel,'Kecocokan isi balasan dengan pertanyaan customer'],['Kejelasan',clar,short?`${short} balasan terlalu singkat`:'Panjang balasan sudah wajar'],
  ['Naturalitas',nat,!kak?'Belum memakai sapaan "Kak"':repeated?'Ada frasa yang diulang':formal?'Ada kalimat terlalu formal':'Bahasa terasa natural'],
  ['Empati',emp,complaint&&emp<50?'Customer kecewa tapi belum ada empati':'Ungkapan empati dan terima kasih'],['Proaktif',pro,asks?`${asks} pertanyaan lanjutan/penawaran bantuan`:'Belum ada pertanyaan lanjutan'],
  ['Akurasi produk',pa,pa==null?'':unknown.length?'Menyebut kode yang tidak ada di Product Knowledge: '+unknown.join(', '):claims?'Ada klaim tanpa rujukan data resmi':'Tidak ada klaim yang bermasalah'],
  ['Akurasi order',oa,oa==null?'':'Konfirmasi detail ukuran/alamat/jumlah'],['Closing',clo,clo>60?'Pesan terakhir memberi arah berikutnya':'Pesan terakhir belum menawarkan langkah berikutnya'],
  ['Manajemen ekspektasi',exp,vague?'Ada janji menggantung atau terlalu pasti':'Ekspektasi dikelola dengan jelas']].map(([n,v,t])=>[n,v==null?null:clampS(v),t]);
 const sc=D.filter(d=>d[1]!=null);const overall=A.length?Math.round(sc.reduce((a,d)=>a+d[1],0)/sc.length):0;
 const good=D.filter(d=>d[1]!=null&&d[1]>=78).map(d=>d[0]+': '+d[2]);const improve=D.filter(d=>d[1]!=null&&d[1]<65).map(d=>d[0]+': '+d[2]);
 const flagged=[];msgs.forEach((m,i)=>{if(m[0]!=='a')return;const t=String(m[1]||''),l=t.toLowerCase();const is=[];
  if(t.trim().length<15)is.push(['Terlalu singkat','Tambahkan sapaan dan satu kalimat lanjutan yang membantu.']);
  if(/usahakan|secepatnya/.test(l))is.push(['Janji menggantung','Ganti dengan langkah konkret: "Kami cek dulu ya, Kak. Nanti kami kabari setelah ada kepastian."']);
  if(/pasti|dijamin|adem/.test(l))is.push(['Klaim tanpa data','Rujuk informasi resmi dari Product Knowledge, atau tawarkan foto/detail.']);
  if(/dengan hormat|kami informasikan bahwa/.test(l))is.push(['Terlalu formal','Pakai bahasa percakapan yang tetap sopan.']);
  if(!/\bkak\b/.test(l)&&t.length>=15)is.push(['Tanpa sapaan','Gunakan sapaan "Kak" agar terasa hangat.']);
  if(is.length)flagged.push({text:t,issues:is});});
 const lastC=C[C.length-1]||'';let rec=null;
 const bs=[...SCRIPTS.map(s=>({t:s.response,src:'Script: '+s.title,n:kaScore(lastC,s.title+' '+s.response,s.cat)})),...CASES.map(c=>({t:c.recommendation,src:'Studi kasus: '+c.title,n:kaScore(lastC,c.title+' '+c.customerMsg,c.cat)}))].sort((a,b)=>b.n-a.n)[0];
 if(bs&&bs.n>=2)rec=bs;
 return {overall,dims:D,good,improve,flagged,rec,nAdmin:A.length,provider:AIService.provider};}

 s=s.replace(/\b(jl\.?|jln\.?|jalan|gg\.?|gang|perum(ahan)?|komplek|blok)\s+[^\n,]{3,40}/gi,'[alamat disamarkan]');
 (names||[]).filter(n=>n&&n.length>=2).forEach(n=>{s=s.replace(new RegExp('\\b'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi'),'[Customer]');});

 return {'Nomor HP':c(/(\+?62|0)8[\d\s.-]{7,14}\d/g),'Email':c(/[\w.+-]+@[\w-]+\.[\w.]+/g),'Rekening':c(/\b(rek(ening)?|bca|bni|bri|mandiri|bsi)\b[^\d\n]{0,12}\d[\d\s.-]{6,20}\d/gi),'ID transaksi':c(/#?\b(SMQ|INV|TRX|ORD|ORDER)[-\s]?\d[\w-]*/gi),'Alamat':c(/\b(jl\.?|jln\.?|jalan|gg\.?|gang|perum(ahan)?|komplek|blok)\s+[^\n,]{3,40}/gi),'Nama':(names||[]).filter(n=>n&&new RegExp('\\b'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(s)).length};}

 const found=piiScan(raw,names);const tot=Object.values(found).reduce((a,b)=>a+b,0);
 const prev=keys.map(k=>{const v=String(($('sf_'+k)||{}).value||'');return v?`<div class="xs muted" style="margin-top:8px">${k==='customerMsg'?'Pesan customer':k==='adminPrev'?'Respons admin':k==='situation'?'Situasi':'Rekomendasi'}</div><div class="sm" style="white-space:pre-wrap">${esc(on?anonymize(v,names):v)}</div>`:'';}).join('');
 $('sf_privprev').innerHTML=`<div class="note ${tot&&!on?'rd':tot?'gn':'nt'}" style="display:block"><b>${tot?tot+' data pribadi terdeteksi':'Tidak ada pola data pribadi terdeteksi'}</b>${tot?' ('+Object.entries(found).filter(x=>x[1]).map(x=>x[0]+': '+x[1]).join(', ')+')':''}${tot&&!on?' — aktifkan "Samarkan identitas customer".':tot?' — akan disamarkan saat disimpan.':''}<div style="margin-top:6px;border-top:1px solid rgba(0,0,0,.08);padding-top:4px">${prev||'<span class="xs">Isi kolom percakapan untuk melihat pratinjau.</span>'}</div><div class="xs muted" style="margin-top:6px">Deteksi berbasis pola dan bisa terlewat. Tetap periksa manual sebelum menyimpan.</div></div>`;icons();}

/* =========================================================
   SCRIPT LIBRARY — redesigned page (logic & data tetap)
   ========================================================= */
PAGES.scripts=()=>{if(S.scriptQ){S.slQ.script=S.scriptQ;S.scriptTab='script';S.scriptQ='';}const t=S.scriptTab;
 const addL={script:'Tambah Script',case:'Tambah Kasus',ba:'Tambah Contoh'}[t];const ph={script:'Cari judul, respons, tag…',case:'Cari kasus, pesan, pelajaran…',ba:'Cari situasi, respons…'}[t];
 return pageHead('Learning & Service','Script Library','Panduan percakapan, studi kasus nyata, dan contoh perbaikan respons. Gunakan sebagai acuan, bukan kalimat wajib.',can('manage')?`<button class="btn p" onclick="slForm('${t}')">${ic('plus')}${addL}</button>`:'')+
`<div class="row sp wrap" style="margin-bottom:16px"><div class="seg">${[['script','Script','message-square-text'],['case','Studi Kasus','briefcase'],['ba','Before & After','repeat']].map(([k,l,i])=>`<button class="${t===k?'on':''}" onclick="S.scriptTab='${k}';go('scripts')">${ic(i)}${l.replace('&','&amp;')} <span class="n">${SL[k].arr.length}</span></button>`).join('')}</div>
<div class="search" style="max-width:340px">${ic('search')}<input class="inp" id="slSearch" placeholder="${ph}" value="${esc(S.slQ[t])}" oninput="S.slQ['${t}']=this.value;drawSL()"></div></div>
<div class="note ${t==='case'?'gn':'nt'}" style="margin-bottom:18px">${ic(t==='case'?'lightbulb':'info')}<div>${t==='case'?'<b>Pahami situasinya, bukan hafalkan jawabannya.</b> Studi kasus membantu mengenali pola masalah dan cara berpikir saat melayani customer.':'<b>Script adalah panduan, bukan kalimat wajib.</b> Sesuaikan dengan konteks percakapan, nama, dan kebutuhan customer supaya tetap natural.'}</div></div>
<div class="lib"><div class="rail" id="slRail"></div><div style="min-width:0"><div class="rail-sel" style="margin-bottom:12px" id="slSel"></div>${t==='case'?'<div class="seg" id="slMarks" style="margin-bottom:14px"></div>':''}<div id="slGrid"></div></div></div>`;};
AFTER.scripts=drawSL;
function drawSL(){const t=S.scriptTab,arr=SL[t].arr;if(!$('slRail'))return;
 const cnt=c=>c==='Semua'?arr.length:arr.filter(x=>x.cat===c).length;const cats=['Semua',...SCAT];
 $('slRail').innerHTML=`<div class="rt">Kategori</div>`+cats.map(c=>`<button class="${S.slCat[t]===c?'on':''}" onclick="S.slCat['${t}']='${c}';drawSL()"><span>${c==='Semua'?'Semua kategori':c.replace('&','&amp;')}</span><span class="n">${cnt(c)}</span></button>`).join('');
 $('slSel').innerHTML=`<select class="inp" onchange="S.slCat['${t}']=this.value;drawSL()">${cats.map(c=>`<option value="${esc(c)}" ${S.slCat[t]===c?'selected':''}>${c==='Semua'?'Semua kategori':esc(c)} (${cnt(c)})</option>`).join('')}</select>`;
 if(t==='case'&&$('slMarks'))$('slMarks').innerHTML=['Semua',...CASE_MARKS].map(m=>`<button class="${S.caseMark===m?'on':''}" onclick="S.caseMark='${m}';drawSL()">${m==='Semua'?'Semua tanda':m} <span class="n">${m==='Semua'?arr.length:arr.filter(x=>x.mark===m).length}</span></button>`).join('');
 const q=S.slQ[t].trim().toLowerCase();const l=arr.filter(x=>(S.slCat[t]==='Semua'||x.cat===S.slCat[t])&&(t!=='case'||S.caseMark==='Semua'||x.mark===S.caseMark)&&slMatch(t,x,q));
 const g=$('slGrid');
 if(!l.length){g.className='';g.innerHTML=emptyBox(q?'search-x':'inbox',q?'Tidak ada hasil':'Belum ada data',q?'Coba kata kunci lain atau ubah filter.':'Belum ada '+SL[t].label.toLowerCase()+' di kategori ini.',can('manage')?`<button class="btn sm" onclick="slForm('${t}')">${ic('plus')}Tambah</button>`:'');icons();return;}
 g.className=t==='ba'?'':'grid g2';g.innerHTML=l.map(x=>t==='script'?scrCard(x):t==='case'?caseCard(x):baCard(x)).join('');icons();}
function baCard(x){return `<div class="card" style="margin-bottom:14px"><div class="row sp wrap" style="align-items:flex-start"><div><h3 style="font-size:15.5px">${esc(x.title)}</h3><div class="row mt1" style="gap:6px"><span class="tag gr">${esc(x.cat)}</span>${x.sample?'<span class="tag">Contoh</span>':''}</div></div>
<div class="row wrap"><button class="btn sm" onclick="slCopy('ba','${x.id}','after')">${ic('copy')}Copy After</button>${mBtns('ba',x.id)}</div></div>
<div class="dd mt"><div class="dont"><div class="lbl">Before</div>"${esc(x.before)}"</div><div class="do"><div class="lbl">After</div>"${esc(x.after)}"</div></div>
<div class="grid g2 mt" style="gap:12px"><div class="sm"><div class="xs muted" style="font-weight:600;text-transform:uppercase;letter-spacing:.05em">Kenapa lebih baik</div>${esc(x.why)}</div>${x.notes?`<div class="sm"><div class="xs muted" style="font-weight:600;text-transform:uppercase;letter-spacing:.05em">Catatan untuk admin</div>${esc(x.notes)}</div>`:''}</div></div>`;}

function kaExtra(q){const box=s=>`<div style="border:1px solid var(--b);border-radius:10px;padding:10px 12px;margin-top:6px">${s}</div>`;let h='',n=0;
 const pr=DBK.problem.arr.map(p=>({p,n:kaScore(q,[p.title,p.situation,p.concern].join(' '),(p.scriptCats||[])[0])})).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n).slice(0,1);
 const gd=DBK.guide.arr.map(g=>({g,n:kaScore(q,[g.title,g.summary,(g.points||[]).join(' '),(g.pairs||[]).join(' ')].join(' '),'')})).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n).slice(0,1);
 const fl=DBK.flow.arr.map(f=>({f,n:kaScore(q,[f.title,f.desc,f.goal].join(' '),'')})).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n).slice(0,1);
 if(pr.length){n++;const p=pr[0].p;h+=`<div style="margin-top:10px"><b>Problem Solving</b></div>`+box(`<a href="#" onclick="event.preventDefault();openProblem('${p.id}')" style="color:inherit;font-weight:600">${esc(p.title)}</a><ol class="steps mt1" style="font-size:13px">${(p.process||[]).slice(0,5).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${p.sop?'':`<div class="xs mt1" style="color:var(--warn)">Kebijakan belum dikonfigurasi. Verifikasi ke supervisor.</div>`}`);}
 if(gd.length){n++;const g=gd[0].g;h+=`<div style="margin-top:10px"><b>Communication Guidelines</b></div>`+box(`<a href="#" onclick="event.preventDefault();S.guide='${g.id}';go('guidelines')" style="color:inherit;font-weight:600">${esc(g.title)}</a><div class="sm muted mt1">${esc(g.takeaway)}</div>`);}
 if(fl.length){n++;const f=fl[0].f;h+=`<div style="margin-top:10px"><b>Chat Flow</b></div>`+box(`<a href="#" onclick="event.preventDefault();S.flow='${f.id}';go('flow')" style="color:inherit;font-weight:600">${esc(f.title)}</a><div class="sm muted mt1">${esc(f.goal)}</div>`);}
 return n?{h,n}:null;}
function localAnswer(q){const l=q.toLowerCase();let ph=null,sc=null,ex=null;try{ph=kaProductAnswer(q);}catch(e){}try{sc=kaScriptCase(q);}catch(e){}try{ex=kaExtra(q);}catch(e){}
 const kb=KB.find(k=>k.k.some(w=>l.includes(w)));
 if(!ph&&!sc&&!ex)return {text:kb?kb.a:'Maaf, informasi tersebut belum tersedia di Product Knowledge, Script Library, Problem Solving, maupun Communication Guidelines. Cek informasi resmi perusahaan atau tanyakan ke supervisor.'};
 let h='';if(kb&&!ph)h+=`<div style="white-space:pre-wrap">${esc(kb.a)}</div>`;if(ph)h+=ph;if(ex)h+=ex.h;
 if(sc)h+=sc.h;
 h+=`<div class="xs muted mt1" style="border-top:1px solid var(--b);padding-top:6px">Jawaban disusun dari data di browser (demo lokal). Selalu ikuti SOP dan informasi resmi perusahaan.</div>`;return {html:h};}
function askKA(q){q=(q||'').trim();if(!q)return;S.ka.push(['u',q]);if(S.page!=='assistant')go('assistant');else go('assistant');
 const c=$('kaChat');if(c){c.insertAdjacentHTML('beforeend','<div class="bubble bai typing" id="kaT"><span></span><span></span><span></span></div>');c.scrollTop=1e6;}
 AIService.answerQuestion(q).then(r=>{S.ka.push(['b',r.text||'',r.html||null]);if(S.page==='assistant')go('assistant',null,{keepScroll:true});});}
